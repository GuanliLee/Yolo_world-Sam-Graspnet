# YOLO-World 开放词汇检测配置文件

# 检测参数
detection:
  conf_threshold: 0.10    # 置信度阈值
  iou_threshold: 0.45     # NMS IOU 阈值
  max_detections: 10    # 每张图最大检测数量
  imgsz: 640              # 推理图像尺寸

# 优化参数
optimization:
  use_fp16: false         # 是否使用 FP16（半精度）

# 模型配置
block:
  model_filename: "yolov8x-worldv2.pt"  # 模型文件路径（相对于模型目录）

# 调试选项
debug:
  save_visualization: true      # 是否保存可视化结果到 debug 目录
